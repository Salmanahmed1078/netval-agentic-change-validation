hostname leaf3
device-role router
!
interface eth1
 description to spine1
 ip address 10.0.2.17/30
 bandwidth 40000
 mtu 1500
 ip ospf area 0
 ip ospf cost 10
 ip ospf hello-interval 10
 ip ospf dead-interval 40
 bfd
!
interface eth2
 description to spine2
 ip address 10.0.2.21/30
 bandwidth 40000
 mtu 1500
 ip ospf area 0
 ip ospf cost 10
 ip ospf hello-interval 10
 ip ospf dead-interval 40
 bfd
!
interface ge1
 description server db-a1
 switchport access vlan 130
!
interface lo
 ip address 10.255.2.13/32
 ip ospf area 0
!
interface vlan130
 description vlan 130 gateway
 ip address 10.103.1.1/24
 bandwidth 1000
 mtu 9000
 ip ospf area 0
 ip ospf passive
 ip access-group ACL_TENANT_A_IN in
 ip access-group ACL_DBA_OUT out
!
router ospf
 router-id 10.255.2.13
 timers throttle spf 50 200 5000
!
ip access-list ACL_DBA_OUT
 10 permit tcp 10.102.1.0/24 10.103.1.0/24 eq 5432
 20 permit icmp 10.99.0.0/24 10.103.1.0/24
 25 permit ip 10.101.2.0/24 any
 30 permit tcp 10.99.0.0/24 10.103.1.0/24 eq 22
 40 deny ip any any
!
ip access-list ACL_TENANT_A_IN
 10 deny ip 10.100.0.0/13 10.200.0.0/13
 20 permit ip any any
!
end
