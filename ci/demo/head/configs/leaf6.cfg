hostname leaf6
device-role router
!
interface eth1
 description to spine1
 ip address 10.0.2.41/30
 bandwidth 10000
 mtu 1500
 ip ospf area 0
 ip ospf cost 10
 ip ospf hello-interval 10
 ip ospf dead-interval 40
 bfd
!
interface eth2
 description to spine2
 ip address 10.0.2.45/30
 bandwidth 10000
 mtu 1500
 ip ospf area 0
 ip ospf cost 10
 ip ospf hello-interval 10
 ip ospf dead-interval 40
 bfd
!
interface ge1
 description server dns-dc1
 switchport access vlan 300
!
interface ge2
 description server backup1
 switchport access vlan 310
!
interface lo
 ip address 10.255.2.16/32
 ip ospf area 0
!
interface vlan300
 description vlan 300 gateway
 ip address 10.30.0.1/24
 bandwidth 1000
 mtu 9000
 ip ospf area 0
 ip ospf passive
!
interface vlan310
 description vlan 310 gateway
 ip address 10.31.0.1/24
 bandwidth 1000
 mtu 9000
 ip ospf area 0
 ip ospf passive
!
router ospf
 router-id 10.255.2.16
 timers throttle spf 50 200 5000
!
ip route 10.30.99.0/24 null0
!
end
