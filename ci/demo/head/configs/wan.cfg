hostname wan
device-role router
!
interface eth1
 description host segment
 ip address 198.18.0.1/24
 bandwidth 10000
 mtu 1500
!
interface eth2
 description to border1
 ip address 10.0.2.74/30
 bandwidth 10000
 mtu 1500
!
interface eth3
 description to border2
 ip address 10.0.2.78/30
 bandwidth 10000
 mtu 1500
!
interface lo
 ip address 198.18.255.1/32
!
router bgp 64600
 neighbor 10.0.2.73 remote-as 65020
 neighbor 10.0.2.77 remote-as 65020
 network 198.18.0.0/24
!
end
