hostname oob
device-role router
!
interface eth1
 description to spine1
 ip address 10.0.2.57/30
 bandwidth 1000
 mtu 1500
 ip ospf area 0
 ip ospf cost 10
 ip ospf hello-interval 10
 ip ospf dead-interval 40
 bfd
!
interface eth2
 description to spine2
 ip address 10.0.2.69/30
 bandwidth 1000
 mtu 1500
 ip ospf area 0
 ip ospf cost 10
 ip ospf hello-interval 10
 ip ospf dead-interval 40
 bfd
!
interface eth3
 description host segment
 ip address 10.99.0.1/24
 bandwidth 1000
 mtu 1500
 ip ospf area 0
 ip ospf cost 10
 ip ospf hello-interval 10
 ip ospf dead-interval 40
 ip ospf passive
!
interface lo
 ip address 10.255.2.30/32
 ip ospf area 0
!
router ospf
 router-id 10.255.2.30
 timers throttle spf 50 200 5000
!
end
