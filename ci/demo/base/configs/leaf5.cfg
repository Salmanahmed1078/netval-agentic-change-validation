hostname leaf5
device-role router
!
interface eth1
 description to spine1
 ip address 10.0.2.33/30
 bandwidth 40000
 mtu 1500
 ip ospf area 0
 ip ospf cost 10
 ip ospf hello-interval 10
 ip ospf dead-interval 40
 bfd
!
interface eth2
 description to spine2
 ip address 10.0.2.37/30
 bandwidth 40000
 mtu 1500
 ip ospf area 0
 ip ospf cost 10
 ip ospf hello-interval 10
 ip ospf dead-interval 40
 bfd
!
interface ge1
 description server db-b1
 switchport access vlan 230
!
interface lo
 ip address 10.255.2.15/32
 ip ospf area 0
!
interface vlan230
 description vlan 230 gateway
 ip address 10.203.1.1/24
 bandwidth 1000
 mtu 9000
 ip ospf area 0
 ip ospf passive
 ip access-group ACL_TENANT_B_IN in
 ip access-group ACL_DBB_OUT out
!
router ospf
 router-id 10.255.2.15
 timers throttle spf 50 200 5000
!
ip access-list ACL_DBB_OUT
 10 permit tcp 10.201.1.0/24 10.203.1.0/24 eq 5432
 20 permit icmp 10.99.0.0/24 10.203.1.0/24
 30 permit tcp 10.99.0.0/24 10.203.1.0/24 eq 22
 40 deny ip any any
!
ip access-list ACL_TENANT_B_IN
 10 deny ip 10.200.0.0/13 10.100.0.0/13
 20 permit ip any any
!
end
