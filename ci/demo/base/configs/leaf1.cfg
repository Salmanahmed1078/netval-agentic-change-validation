hostname leaf1
device-role router
!
interface eth1
 description to spine1
 ip address 10.0.2.1/30
 bandwidth 40000
 mtu 1500
 ip ospf area 0
 ip ospf cost 10
 ip ospf hello-interval 10
 ip ospf dead-interval 40
 bfd
!
interface eth2
 description to spine2
 ip address 10.0.2.5/30
 bandwidth 40000
 mtu 1500
 ip ospf area 0
 ip ospf cost 10
 ip ospf hello-interval 10
 ip ospf dead-interval 40
 bfd
!
interface ge1
 description server web-a1
 switchport access vlan 110
!
interface ge2
 description server stage-a1
 switchport access vlan 111
!
interface lo
 ip address 10.255.2.11/32
 ip ospf area 0
!
interface vlan110
 description vlan 110 gateway
 ip address 10.101.1.1/24
 bandwidth 1000
 mtu 9000
 ip ospf area 0
 ip ospf passive
 ip access-group ACL_TENANT_A_IN in
!
interface vlan111
 description vlan 111 gateway
 ip address 10.101.2.1/24
 bandwidth 1000
 mtu 9000
 ip ospf area 0
 ip ospf passive
 ip access-group ACL_TENANT_A_IN in
!
router ospf
 router-id 10.255.2.11
 timers throttle spf 50 200 5000
!
ip access-list ACL_TENANT_A_IN
 10 deny ip 10.100.0.0/13 10.200.0.0/13
 20 permit ip any any
!
end
