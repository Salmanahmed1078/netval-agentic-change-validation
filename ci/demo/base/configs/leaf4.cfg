hostname leaf4
device-role router
!
interface eth1
 description to spine1
 ip address 10.0.2.25/30
 bandwidth 40000
 mtu 1500
 ip ospf area 0
 ip ospf cost 10
 ip ospf hello-interval 10
 ip ospf dead-interval 40
 bfd
!
interface eth2
 description to spine2
 ip address 10.0.2.29/30
 bandwidth 40000
 mtu 1500
 ip ospf area 0
 ip ospf cost 10
 ip ospf hello-interval 10
 ip ospf dead-interval 40
 bfd
!
interface ge1
 description server web-b1
 switchport access vlan 210
!
interface ge2
 description server stage-b1
 switchport access vlan 211
!
interface lo
 ip address 10.255.2.14/32
 ip ospf area 0
!
interface vlan210
 description vlan 210 gateway
 ip address 10.201.1.1/24
 bandwidth 1000
 mtu 9000
 ip ospf area 0
 ip ospf passive
 ip access-group ACL_TENANT_B_IN in
!
interface vlan211
 description vlan 211 gateway
 ip address 10.201.2.1/24
 bandwidth 1000
 mtu 9000
 ip ospf area 0
 ip ospf passive
 ip access-group ACL_TENANT_B_IN in
!
router ospf
 router-id 10.255.2.14
 timers throttle spf 50 200 5000
!
ip route 10.201.99.0/24 null0
!
ip access-list ACL_TENANT_B_IN
 10 deny ip 10.200.0.0/13 10.100.0.0/13
 20 permit ip any any
!
end
