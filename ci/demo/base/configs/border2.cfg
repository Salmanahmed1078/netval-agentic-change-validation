hostname border2
device-role router
!
interface eth1
 description to spine1
 ip address 10.0.2.53/30
 bandwidth 100000
 mtu 1500
 ip ospf area 0
 ip ospf cost 10
 ip ospf hello-interval 10
 ip ospf dead-interval 40
 bfd
!
interface eth2
 description to spine2
 ip address 10.0.2.65/30
 bandwidth 100000
 mtu 1500
 ip ospf area 0
 ip ospf cost 10
 ip ospf hello-interval 10
 ip ospf dead-interval 40
 bfd
!
interface eth3
 description to wan
 ip address 10.0.2.77/30
 bandwidth 10000
 mtu 1500
!
interface lo
 ip address 10.255.2.22/32
 ip ospf area 0
!
router ospf
 router-id 10.255.2.22
 timers throttle spf 50 200 5000
 redistribute bgp route-map RM_BGP2OSPF
!
router bgp 65020
 neighbor 10.0.2.78 remote-as 64600
 neighbor 10.0.2.78 route-map RM_FROM_WAN in
 neighbor 10.0.2.78 route-map RM_TO_WAN out
 redistribute ospf route-map RM_TO_WAN
!
ip prefix-list PL_PUBLIC seq 5 permit 10.101.1.0/24
ip prefix-list PL_PUBLIC seq 10 permit 10.201.1.0/24
!
ip prefix-list PL_WAN seq 5 permit 198.18.0.0/24
!
route-map RM_BGP2OSPF permit 10
 match ip address prefix-list PL_WAN
!
route-map RM_FROM_WAN permit 10
 match ip address prefix-list PL_WAN
!
route-map RM_TO_WAN permit 10
 match ip address prefix-list PL_PUBLIC
!
end
